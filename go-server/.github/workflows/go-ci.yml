name: Go CI

on:
  push:
    branches: [golang_master, "phase/*"]
    paths: ["go-server/**"]
  pull_request:
    branches: [golang_master]
    paths: ["go-server/**"]

defaults:
  run:
    working-directory: go-server

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: go-server

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -v -race -coverprofile=coverage.out
      - name: Coverage
        run: go tool cover -func=coverage.out

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build
        run: go build -o bin/wedding-server ./cmd/server
